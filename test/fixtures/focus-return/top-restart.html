<!doctype html><html lang="en"><head><meta charset="utf-8"><title>focus return</title><style>body{margin:0;font:16px sans-serif}[hidden]{display:none}</style></head><body><a href="#home">Home</a><a href="#news">News</a><nav><button id="t" type="button" aria-expanded="false" aria-controls="p">Brands</button><div id="p" hidden><a href="#a">One</a></div></nav><main><button id="after" type="button">after</button></main>
<script>const t=document.getElementById("t"),p=document.getElementById("p");
t.onclick=()=>{p.hidden=!p.hidden;t.setAttribute("aria-expanded",String(!p.hidden))};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!p.hidden){p.hidden=true;t.setAttribute("aria-expanded","false");document.body.tabIndex=-1;document.body.focus()}});</script></body></html>
