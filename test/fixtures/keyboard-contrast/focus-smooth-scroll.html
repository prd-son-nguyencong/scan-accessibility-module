<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Focus ring after a smooth scroll</title>
<style>html{scroll-behavior:smooth}body{margin:0;padding:24px;background:#fff;font:16px Arial,sans-serif}
.gap{height:1800px}
a{display:inline-block;padding:10px 16px;color:#000;background:#eee;margin:16px}
a:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}
.faint:focus-visible{outline:3px solid #f2f2f2}</style></head>
<body><main id="main"><a href="#main">Top link</a><div class="gap"></div><a href="#main" class="good">Far link</a><a href="#main" class="faint">Far faint</a></main></body></html>
