<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Image backdrop (borderline)</title>
<style>body{margin:0;font-family:Arial,sans-serif}
/* the left fifth of the image is pale, the rest dark: white text fails only over the pale part */
.hero{display:inline-block;margin:40px 24px;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='10' preserveAspectRatio='none'%3E%3Crect width='100' height='10' fill='%23222222'/%3E%3Crect width='22' height='10' fill='%23f3ead2'/%3E%3C/svg%3E") 0 0/100% 100%}
.hero h1{color:#fff;font-size:32px;margin:0;white-space:nowrap}</style></head>
<body><main id="main"><section class="hero"><h1 class="hero-title">Join our team today</h1></section></main></body></html>
