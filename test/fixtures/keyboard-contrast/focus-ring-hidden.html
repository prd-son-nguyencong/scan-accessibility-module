<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ring painted under an overlay</title>
<style>body{margin:0;padding:48px;background:#fff;font:16px Arial,sans-serif}
.wrap{position:relative;display:inline-block}
.wrap::after{content:"";position:absolute;inset:-20px;background:#fff;pointer-events:none}
a{display:inline-block;padding:10px 16px;color:#000;background:#eee}
a:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}</style></head>
<body><main id="main"><span class="wrap"><a href="#main">Covered ring</a></span></main></body></html>
