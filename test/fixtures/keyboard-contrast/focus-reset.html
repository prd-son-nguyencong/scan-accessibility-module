<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Focus reset</title>
<style>body{margin:0;padding:24px;background:#fff;font:16px Arial,sans-serif}
/* global resets that remove the UA ring */
button{outline:0;margin:16px;padding:10px 16px;font:inherit;background:#fff;color:#000;border:1px solid #888}
a{margin:16px;display:inline-block}
.anchor:focus{outline:none}
.important{outline:0 !important}
/* reset with a replacement ring: not a failure */
.ring:focus-visible{box-shadow:0 0 0 3px #0b57d0}
/* reset with a strong fill change: not a failure */
.fill:focus-visible{background:#000;color:#fff}
/* only a faint fill change (about 1.1:1) */
.weak{background:#f5f5f3;border:0}
.weak:focus-visible{background:#ebebe6}
/* the cue sits on the wrapper, not on the control */
.wrap{display:inline-block;border:2px solid #ccc;margin:16px}
.wrap:focus-within{border-color:#0b57d0}
.wrap input{outline:0;border:0;padding:6px;font:inherit}
/* the cue sits on a child of the control */
.child .inner{display:inline-block;border-bottom:3px solid transparent}
.child:focus-visible .inner{border-bottom-color:#0b57d0}
/* mouse-only reset: the keyboard still gets the UA ring */
.mouse:focus:not(:focus-visible){outline:none}
</style></head>
<body><main id="main">
<button class="plain">Plain reset</button>
<a href="#main" class="anchor">Anchor reset</a>
<button class="important">Important reset</button>
<button class="weak">Weak fill</button>
<button class="ring">Ring replaced</button>
<button class="fill">Fill replaced</button>
<span class="wrap"><input type="text" aria-label="Wrapped"></span>
<button class="child"><span class="inner">Child cue</span></button>
<a href="#main" class="mouse">Mouse only</a>
</main></body></html>
