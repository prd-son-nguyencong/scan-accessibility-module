<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Header that fades dark</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#fff}
header{background:#fff;transition:background-color 30s linear;padding:16px 24px}
header.scrolled{background:#222}
nav a{font-size:16px;margin-right:24px;text-decoration:none;color:#fff}
.spacer{height:300px}</style></head>
<body><header id="bar"><nav><a href="#main">Home</a><a href="#main">Careers</a></nav></header><main id="main"><div class="spacer"></div></main>
<script>window.addEventListener('load',function(){setTimeout(function(){document.getElementById('bar').classList.add('scrolled')},50)})</script></body></html>
