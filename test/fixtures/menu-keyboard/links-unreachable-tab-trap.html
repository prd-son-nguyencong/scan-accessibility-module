<!doctype html><html lang="en"><head><meta charset="utf-8"><title>menu</title><style>body{margin:0;font:16px sans-serif}.p{display:none}.p.open{display:block}</style></head><body><nav><button id="t" aria-expanded="false" aria-controls="p">Life</button><ul id="p" class="p"><li><a href="#a">One</a></li><li><a href="#b">Two</a></li></ul></nav><main><p>content</p><button id="after">after</button></main><script>const t=document.getElementById("t"),p=document.getElementById("p");t.onclick=()=>{const o=!p.classList.contains("open");p.classList.toggle("open",o);t.setAttribute("aria-expanded",String(o))};
// buggy custom key handling: swallows Tab and ArrowDown while the menu is open, so keyboard users can never reach the links
document.addEventListener("keydown",e=>{if(p.classList.contains("open")&&(e.key==="Tab"||e.key==="ArrowDown"))e.preventDefault()})</script></body></html>
