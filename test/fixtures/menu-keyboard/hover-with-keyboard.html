<!doctype html><html lang="en"><head><meta charset="utf-8"><title>menu</title><style>body{margin:0;font:16px sans-serif}.p{display:none}.p.open{display:block}</style></head><body><nav><div id="h"><button id="t" aria-expanded="false" aria-controls="p">Hover</button><ul id="p" class="p"><li><a href="#a">One</a></li></ul></div></nav><main><p>content</p><button id="after">after</button></main><script>const t=document.getElementById("t"),p=document.getElementById("p");const set=o=>{p.classList.toggle("open",o);t.setAttribute("aria-expanded",String(o))};h.onmouseenter=()=>set(true);h.onmouseleave=()=>set(false);t.onclick=()=>set(!p.classList.contains("open"));document.addEventListener("keydown",e=>{if(e.key==="Escape"){set(false);t.focus()}})</script></body></html>
