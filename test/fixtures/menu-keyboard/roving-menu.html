<!doctype html><html lang="en"><head><meta charset="utf-8"><title>menu</title><style>body{margin:0;font:16px sans-serif}.p{display:none}.p.open{display:block}</style></head><body><nav><button id="t" aria-expanded="false" aria-controls="p">Menu</button><ul id="p" class="p"><li><a href="#a" tabindex="-1">One</a></li><li><a href="#b" tabindex="-1">Two</a></li></ul></nav><main><p>content</p><button id="after">after</button></main><script>const t=document.getElementById("t"),p=document.getElementById("p");t.onclick=()=>{const o=!p.classList.contains("open");p.classList.toggle("open",o);t.setAttribute("aria-expanded",String(o))};t.addEventListener("keydown",e=>{if(e.key==="ArrowDown"&&p.classList.contains("open")){e.preventDefault();p.querySelector("a").focus()}});p.addEventListener("keydown",e=>{if(e.key==="Escape"){p.classList.remove("open");t.setAttribute("aria-expanded","false");t.focus()}})</script></body></html>
