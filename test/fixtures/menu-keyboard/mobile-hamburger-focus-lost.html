<!doctype html><html lang="en"><head><meta charset="utf-8"><title>menu</title><style>#t{display:none}@media (max-width:600px){#t{display:inline-block}}body{margin:0;font:16px sans-serif}.p{display:none}.p.open{display:block}</style></head><body><nav><button id="t" aria-expanded="false">Brands</button><ul id="p" class="p"><li><a href="#a">One</a></li></ul></nav><main><p>content</p><button id="after">after</button></main><script>const t=document.getElementById("t"),p=document.getElementById("p");t.onclick=()=>{const o=!p.classList.contains("open");p.classList.toggle("open",o);t.setAttribute("aria-expanded",String(o))};p.addEventListener("keydown",e=>{if(e.key==="Escape"){p.classList.remove("open");t.setAttribute("aria-expanded","false");document.activeElement.blur()}})</script></body></html>
