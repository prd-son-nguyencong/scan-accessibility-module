<!doctype html><html lang="en"><head><meta charset="utf-8"><title>menu</title><style>body{margin:0;font:16px sans-serif}.p{display:none}.p.open{display:block}</style></head><body><main style="height:3000px"><p>long</p></main><footer><button id="t" aria-expanded="false" aria-controls="p">FAQ</button><ul id="p" class="p"><li><a href="#a">One</a></li></ul></footer><a id="btt" href="#top" style="position:fixed;right:0;bottom:0;display:none">Top</a><script>addEventListener("scroll",()=>{document.getElementById("btt").style.display=scrollY>300?"block":"none"})</script><script>const t=document.getElementById("t"),p=document.getElementById("p");t.onclick=()=>{const o=!p.classList.contains("open");p.classList.toggle("open",o);t.setAttribute("aria-expanded",String(o))};p.addEventListener("keydown",e=>{if(e.key==="Escape"){p.classList.remove("open");t.setAttribute("aria-expanded","false");t.focus()}})</script></body></html>
