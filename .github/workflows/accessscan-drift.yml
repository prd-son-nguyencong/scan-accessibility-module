name: accessScan corpus drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessscan-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-drift:
    name: Live manifest drift (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run live drift monitor
        id: drift
        run: bash scripts/accessscan-corpus/run-drift-nonblocking.sh "${RUNNER_TEMP}/accessscan-drift"

      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessscan-drift-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/accessscan-drift/**
          retention-days: 14
          if-no-files-found: warn
